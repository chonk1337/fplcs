<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>FPLCS — Игроки</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    html {
      scrollbar-color: #ff4b1f99 transparent;
      scrollbar-width: thin;
    }

    html::-webkit-scrollbar { width: 10px; }
    html::-webkit-scrollbar-track { background: transparent; }
    html::-webkit-scrollbar-thumb {
      background: #ff4b1f99;
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: content-box;
    }
    html::-webkit-scrollbar-thumb:hover { background-color: #ff4b1f; }

    :root {
      --bg: #08090b;
      --orange: #ff4b1f;
      --white: #f4f5f7;
      --muted: #a1a5ad;
      --border: #282b31;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% -12%, #492014 0, transparent 42%),
        radial-gradient(circle at 8% 42%, #ff4b1f0b 0, transparent 26%),
        radial-gradient(circle at 94% 70%, #ff4b1f0a 0, transparent 25%),
        var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(#ffffff05 1px, transparent 1px),
        linear-gradient(90deg, #ffffff05 1px, transparent 1px);
      background-size: 48px 48px;
      content: "";
      mask-image: linear-gradient(to bottom, #000, transparent 75%);
      pointer-events: none;
    }

    .wrap {
      width: min(100% - 40px, 1080px);
      margin: 0 auto;
    }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img.header-logo {
      display: block;
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-nav a.nav-link {
      display: inline-block;
      padding: 9px 14px;
      color: var(--white);
      background: #202329;
      border: 1px solid #343840;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .3px;
      text-decoration: none;
      white-space: nowrap;
      transition: .2s;
    }

    .header-nav a.nav-link:hover {
      color: #fff;
      background: var(--orange);
      border-color: var(--orange);
      box-shadow: 0 5px 18px #ff4b1f33;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      color: #c4c8ce;
      background: #ffffff06;
      border: 1px solid #ffffff12;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .3px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #4bd783;
      box-shadow: 0 0 12px #4bd78388;
    }

    main { padding: 50px 0 68px; }

    .hero {
      max-width: 760px;
      margin: 0 auto 40px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      width: 22px;
      height: 1px;
      background: var(--orange);
      content: "";
      opacity: .7;
    }

    .hero h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
    }

    .hero p {
      margin: 0 auto;
      max-width: 570px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
    }

    /* ===== Список-таблица ===== */

    .players-list {
      max-width: 860px;
      margin: 0 auto;
      background:
        radial-gradient(ellipse at 100% 0%, #ff4b1f0d, transparent 44%),
        linear-gradient(145deg, #15171c, #0e0f12);
      border: 1px solid #34363c;
      border-radius: 18px;
      box-shadow: 0 24px 80px #0008, inset 0 1px #ffffff08;
      overflow: hidden;
    }

    .players-list-head {
      display: grid;
      grid-template-columns: 64px 1fr 120px 40px;
      gap: 16px;
      align-items: center;
      padding: 14px 22px;
      color: var(--muted);
      background: #ffffff04;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .players-list-head .col-elo { text-align: right; }
    .players-list-head .col-arrow { text-align: center; }

    .player-row {
      display: grid;
      grid-template-columns: 64px 1fr 120px 40px;
      gap: 16px;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      transition: background .2s, border-color .2s;
    }

    .player-row:last-child { border-bottom: 0; }

    .player-row.is-link { cursor: pointer; }

    .player-row:hover {
      background: #ff4b1f08;
    }

    .player-row.is-link:hover {
      background: #ff4b1f10;
      box-shadow: inset 3px 0 0 var(--orange);
    }

    .player-row:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: -2px;
    }

    .row-avatar {
      position: relative;
      width: 52px;
      height: 52px;
      background: #090a0d;
      border: 1px solid #292c33;
      border-radius: 50%;
      overflow: hidden;
      flex: 0 0 52px;
    }

    .row-avatar .avatar-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--orange);
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      user-select: none;
    }

    .row-avatar .player-avatar {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .row-avatar .player-avatar.is-broken { display: none; }

    .row-main {
      min-width: 0;
    }

    .row-name {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .row-desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .row-elo {
      justify-self: end;
      padding: 5px 12px;
      color: var(--orange);
      background: #ff4b1f14;
      border: 1px solid #ff4b1f30;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .row-arrow {
      justify-self: center;
      color: var(--orange);
      font-size: 16px;
      opacity: .5;
      transition: opacity .2s, transform .2s;
    }

    .player-row.is-link:hover .row-arrow {
      opacity: 1;
      transform: translateX(2px);
    }

    .empty-state {
      max-width: 860px;
      margin: 0 auto;
      padding: 34px;
      color: var(--muted);
      background: #0d0e12;
      border: 1px dashed var(--border);
      border-radius: 14px;
      text-align: center;
      font-size: 15px;
    }

    .error-banner {
      max-width: 860px;
      margin: 0 auto 20px;
      padding: 16px 20px;
      color: #ffb3b3;
      background: #2a0e0e;
      border: 1px solid #ff4b4b55;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      padding: 24px 0;
      border-top: 1px solid var(--border);
      color: #777b84;
      text-align: center;
      font-size: 13px;
    }

    footer strong { color: var(--white); }

    /* ===== Мобильная версия: ряд превращается в блок ===== */

    @media (max-width: 650px) {
      main { padding-top: 40px; }
      .hero p { font-size: 15px; }
      .header-nav a.nav-link { font-size: 11px; padding: 8px 11px; }

      .players-list-head {
        display: none;
      }

      .player-row {
        grid-template-columns: 52px 1fr auto;
        grid-template-areas:
          "avatar main elo"
          "avatar desc desc";
        gap: 6px 14px;
        padding: 16px 18px;
      }

      .row-avatar { grid-area: avatar; align-self: start; }
      .row-main { grid-area: main; }
      .row-elo { grid-area: elo; align-self: start; font-size: 12px; padding: 4px 10px; }

      .row-desc {
        grid-area: desc;
        margin: 0;
      }

      .row-arrow { display: none; }
    }

    @media (max-width: 380px) {
      .header-nav a.nav-link { font-size: 10px; padding: 7px 9px; }
      .player-row { padding: 14px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <a class="brand" href="index.html" aria-label="FPLCS — главная">
      <img
        class="header-logo"
        src="icons8-faceit-24.png"
        alt="Логотип FACEIT"
      >
    </a>

    <div class="header-nav">
      <a class="nav-link" href="index.html">На главную</a>

      <div class="status" aria-label="Количество игроков">
        <span class="dot" aria-hidden="true"></span>
        <span id="players-count">Игроков: 0</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Состав сообщества</div>
      <h1>Игроки FPLCS</h1>
      <p>Участники нашего TeamSpeak-сервера. Список отсортирован по ELO — сильнейшие сверху. Клик по строке открывает профиль FACEIT.</p>
    </section>

    <div id="error-banner" class="error-banner" hidden></div>

    <div class="players-list" id="players-list">
      <div class="players-list-head" aria-hidden="true">
        <span></span>
        <span>Игрок / описание</span>
        <span class="col-elo">ELO</span>
        <span class="col-arrow"></span>
      </div>
      <div id="players-body"></div>
    </div>

    <div class="empty-state" id="empty-state" hidden>
      Список пока пуст.
    </div>
  </main>

  <footer class="wrap"><strong>FPLCS</strong> · by cherryzor</footer>

  <script>
    /* ============================================================
       СПИСОК ИГРОКОВ — РЕДАКТИРУЙ ТОЛЬКО ЭТОТ БЛОК
       ============================================================
       Каждый игрок — объект в фигурных скобках:
       {
         nickname: "Ник в TeamSpeak",
         elo: 1250,
         avatar: "https://ссылка/на/картинку.png",
         description: "Пара слов об игроке",
         faceit: "https://www.faceit.com/ru/players/Ник"
       }
       Не забудь запятую между объектами.
       ============================================================ */

    const PLAYERS = [
      {
        nickname: "cherryzor",
        elo: 3554,
        avatar: "https://avatars.fastly.steamstatic.com/a652a7ef1dfa31e395c386ef9908b1ac77d083ef_full.jpg",
        description: "Основатель сервера. Обычно качает колеса на Б",
        faceit: "https://www.faceit.com/ru/players/cherryzor"
      },
      {
        nickname: "SHENSHENNN",
        elo: 3240,
        avatar: "https://avatars.fastly.steamstatic.com/efe776aad8ba660d47ae3d5be1f5c87518b4e9c7_full.jpg",
        description: "Ебашит на тиктоки. Оверпикает на похуй",
        faceit: "https://www.faceit.com/ru/players/SHENSHENNN"
      },
      {
        nickname: "sellpeace",
        elo: 2696,
        avatar: "https://avatars.fastly.steamstatic.com/b75496261d161ca3b0a4d2099e6ed3cc19b1e210_full.jpg",
        description: "Снайпер. Иногда попадает.",
        faceit: "https://www.faceit.com/ru/players/ludozombie"
      },
      {
        nickname: "YouTubik",
        elo: 3657,
        avatar: "https://avatars.fastly.steamstatic.com/a8da2696ba77253be1e38bab0bb35d7b1a61919b_full.jpg",
        description: "Хуй знает кто ему ник придумал",
        faceit: "https://www.faceit.com/ru/players/YouTubik"
      },
      {
        nickname: "darky0y0",
        elo: 3973,
        avatar: "https://avatars.fastly.steamstatic.com/5a117cc90a5f842c829bd99f3c88303b0b88a95e_full.jpg",
        description: "Иногда кажется что с софтом хуярит. Чето вроде умеет в игре",
        faceit: "https://www.faceit.com/ru/players/darky2h"
      },
      {
        nickname: "awdy",
        elo: 3122,
        avatar: "https://avatars.fastly.steamstatic.com/ab1a69c0bd3e3220689ab56b013a0a40a30a3c1b_full.jpg",
        description: "Подпивас с HLTV",
        faceit: "https://www.faceit.com/ru/players/asphyxia-_-"
      },
      {
        nickname: "WhiteN",
        elo: 2674,
        avatar: "https://avatars.fastly.steamstatic.com/da8ef2d2b4e7d0b6d97649fc4b33b4d085ed0ddb_full.jpg",
        description: "У этого чела ебанутый нюх в смоках",
        faceit: "https://www.faceit.com/ru/players/whiten"
      },
      {
        nickname: "YURAB0Y",
        elo: 2778,
        avatar: "https://avatars.fastly.steamstatic.com/c65023014ac714d7dd6ced22d6d4d95ff9c2c1aa_full.jpg",
        description: "Профессионально ебашит на руле",
        faceit: "https://www.faceit.com/ru/players/YURAB0Y"
      },
      {
        nickname: "rareg0d",
        elo: 3073,
        avatar: "https://avatars.fastly.steamstatic.com/b4b84c2eeee866a453eac91c012ba7393b61ef95_full.jpg",
        description: "Редкий бог. Просто Геич",
        faceit: "https://www.faceit.com/ru/players/rareg0d-"
      },
      {
        nickname: "BSB",
        elo: 4418,
        avatar: "https://avatars.fastly.steamstatic.com/66bc76f15d320d43948fb3d354fb25d746a4153d_full.jpg",
        description: "HLTV пиво. На mouse1 жмет вроде.",
        faceit: "https://www.faceit.com/ru/players/dayone-_-"
      },
    ];

    /* ============================================================
       НИЖЕ — КОД ОТРИСОВКИ. ЛУЧШЕ НЕ ТРОГАТЬ.
       ============================================================ */

    const bodyEl = document.getElementById("players-body");
    const listEl = document.getElementById("players-list");
    const emptyState = document.getElementById("empty-state");
    const countEl = document.getElementById("players-count");
    const errorBanner = document.getElementById("error-banner");

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeUrl(url) {
      const trimmed = String(url || "").trim();
      if (!trimmed) return "";
      try {
        const parsed = new URL(trimmed);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          return parsed.href;
        }
        return "";
      } catch {
        return trimmed;
      }
    }

    function eloValue(player) {
      const n = Number(player?.elo);
      return Number.isFinite(n) ? n : -Infinity;
    }

    function sortPlayers(list) {
      return [...list].sort((a, b) => {
        const diff = eloValue(b) - eloValue(a);
        if (diff !== 0) return diff;
        return String(a?.nickname ?? "").localeCompare(String(b?.nickname ?? ""), "ru");
      });
    }

    function firstLetter(name) {
      const s = String(name || "").trim();
      return s ? s.charAt(0) : "?";
    }

    function renderRow(p) {
      const safeName = escapeHtml(p?.nickname ?? "");
      const avatar = normalizeUrl(p?.avatar);
      const faceit = normalizeUrl(p?.faceit);
      const letter = escapeHtml(firstLetter(p?.nickname));

      const avatarHtml = `
        <div class="row-avatar">
          <span class="avatar-fallback" aria-hidden="true">${letter}</span>
          ${avatar
            ? `<img class="player-avatar" src="${escapeHtml(avatar)}" alt="" loading="lazy" onerror="this.classList.add('is-broken')">`
            : ""}
        </div>
      `;

      const rowClass = faceit ? "player-row is-link" : "player-row";
      const linkAttrs = faceit
        ? ` data-faceit="${escapeHtml(faceit)}" role="link" tabindex="0" aria-label="Открыть профиль FACEIT игрока ${safeName}"`
        : "";

      const descHtml = p?.description
        ? `<p class="row-desc">${escapeHtml(p.description)}</p>`
        : "";

      const arrowHtml = faceit
        ? `<span class="row-arrow" aria-hidden="true">↗</span>`
        : `<span class="row-arrow" aria-hidden="true"></span>`;

      return `
        <article class="${rowClass}"${linkAttrs}>
          ${avatarHtml}
          <div class="row-main">
            <h3 class="row-name">${safeName}</h3>
            ${descHtml}
          </div>
          <span class="row-elo">ELO ${escapeHtml(p?.elo)}</span>
          ${arrowHtml}
        </article>
      `;
    }

    function render() {
      try {
        const list = Array.isArray(PLAYERS) ? PLAYERS : [];
        const sorted = sortPlayers(list);

        countEl.textContent = `Игроков: ${sorted.length}`;
        emptyState.hidden = sorted.length > 0;
        listEl.hidden = sorted.length === 0;
        errorBanner.hidden = true;
        errorBanner.textContent = "";

        const rows = [];
        for (let i = 0; i < sorted.length; i++) {
          try {
            rows.push(renderRow(sorted[i]));
          } catch (err) {
            console.error(`Ошибка в игроке #${i}:`, err, sorted[i]);
          }
        }

        bodyEl.innerHTML = rows.join("");
      } catch (err) {
        console.error("Ошибка рендера списка:", err);
        errorBanner.hidden = false;
        errorBanner.textContent =
          "Не удалось отрисовать список игроков: " + err.message +
          ". Проверь массив PLAYERS — вероятно, там синтаксическая ошибка.";
      }
    }

    bodyEl.addEventListener("click", (event) => {
      const row = event.target.closest(".player-row.is-link");
      if (!row) return;
      const url = row.dataset.faceit;
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    });

    bodyEl.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const row = event.target.closest(".player-row.is-link");
      if (!row) return;
      event.preventDefault();
      const url = row.dataset.faceit;
      if (url) window.open(url, "_blank", "noopener,noreferrer");
    });

    render();
  </script>
</body>
</html>
